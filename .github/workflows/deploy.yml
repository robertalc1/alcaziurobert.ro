name: Deploy pe Hosterion

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      # Public GA4 web-stream ID, compiled into the client bundle by Vite.
      # Keep it explicit so a legacy repository secret cannot route hits to
      # the old property. Consent remains controlled by the cookie banner.
      VITE_GA_MEASUREMENT_ID: G-PJKHF484GD

    steps:
      - name: Checkout cod
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalare dependente
        run: npm ci

      - name: Verifica ID-ul Google Analytics
        env:
          GA: ${{ env.VITE_GA_MEASUREMENT_ID }}
        run: |
          if ! printf '%s' "$GA" | grep -qE '^G-[A-Z0-9]{10}$'; then
            echo "::error title=GA4 invalid::VITE_GA_MEASUREMENT_ID trebuie sa aiba forma G-XXXXXXXXXX."
            exit 1
          fi
          echo "GA4 configurat: $GA"

      # `npm run build` prerenders every route in a real browser after vite
      # finishes, so the runner needs one. Chromium only — the other engines
      # would triple the download for nothing.
      - name: Instalare Chromium pentru prerender
        run: npx playwright install --with-deps chromium

      - name: Build (vite build + prerender)
        run: npm run build
        env:
          # VITE_GA_MEASUREMENT_ID is inherited from the job's public config.
          # Optional override; src/lib/marketingPixels.ts falls back to the
          # hardcoded pixel id when this secret is not set.
          VITE_FB_PIXEL_ID: ${{ secrets.VITE_FB_PIXEL_ID }}

      - name: Pregatire fisiere pentru deploy
        run: |
          rm -rf deploy
          mkdir -p deploy/tmp
          cp -R dist deploy/dist
          # route-meta.json is read by server.js at boot to render per-route
          # title/description/canonical. Without it every page ships with the
          # homepage's tags again.
          cp server.js package.json package-lock.json route-meta.json deploy/
          date -u +"restart-%Y%m%dT%H%M%SZ" > deploy/tmp/restart.txt

      - name: Deploy pe Hosterion (FTPS)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./deploy/
          server-dir: ./
          exclude: |
            **/node_modules/**
            # Server-side state that must survive a deploy. Without these the
            # sync would delete the lead backup and the installed dependencies.
            **/leads.jsonl
            **/.env
            **/logs/**
