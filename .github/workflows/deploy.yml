name: Deploy pe Hosterion

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout cod
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalare dependente
        run: npm ci

      # A missing VITE_* secret does not fail the build — it silently inlines an
      # empty string, and the feature it powers simply stops existing in
      # production with nothing in the log to say so. This is exactly how GA4
      # went missing from the deployed bundle, so the gap gets announced.
      - name: Verifica secretele de tracking
        env:
          GA: ${{ secrets.VITE_GA_MEASUREMENT_ID }}
        run: |
          if [ -z "$GA" ]; then
            echo "::warning title=GA4 lipseste::VITE_GA_MEASUREMENT_ID nu este setat in Settings -> Secrets -> Actions. Google Analytics NU va exista in build-ul de productie."
          elif ! printf '%s' "$GA" | grep -qE '^G-[A-Z0-9]+$'; then
            # Un spatiu lipit odata cu ID-ul trece de orice verificare de tipul
            # "e gol?" si ajunge in URL-ul tag-ului ca %20. Scriptul se incarca,
            # Google raspunde, nu se colecteaza nimic si nu apare nicio eroare.
            echo "::warning title=GA4 invalid::VITE_GA_MEASUREMENT_ID nu are forma G-XXXXXXXXXX (spatiu in plus? ghilimele?). Codul face trim, dar curata secretul."
          else
            echo "GA4 configurat."
          fi

      - name: Build (vite build)
        run: npm run build
        env:
          # VITE_* vars are inlined at build time, so GA4 has to be set here.
          # Empty secret = analytics simply stays off.
          VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}
          # Optional override; src/lib/marketingPixels.ts falls back to the
          # hardcoded pixel id when this secret is not set.
          VITE_FB_PIXEL_ID: ${{ secrets.VITE_FB_PIXEL_ID }}

      - name: Pregatire fisiere pentru deploy
        run: |
          rm -rf deploy
          mkdir -p deploy/tmp
          cp -R dist deploy/dist
          # route-meta.json is read by server.js at boot to render per-route
          # title/description/canonical. Without it every page ships with the
          # homepage's tags again.
          cp server.js package.json package-lock.json route-meta.json deploy/
          date -u +"restart-%Y%m%dT%H%M%SZ" > deploy/tmp/restart.txt

      - name: Deploy pe Hosterion (FTPS)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./deploy/
          server-dir: ./
          exclude: |
            **/node_modules/**
            # Server-side state that must survive a deploy. Without these the
            # sync would delete the lead backup and the installed dependencies.
            **/leads.jsonl
            **/.env
            **/logs/**
