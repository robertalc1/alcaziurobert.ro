    <use href="#digit" transform="translate(0.36 2.25)"/>
    <use href="#digit" transform="translate(0.32 2.00)"/>
    <use href="#digit" transform="translate(0.28 1.75)"/>
    <use href="#digit" transform="translate(0.24 1.50)"/>
    <use href="#digit" transform="translate(0.20 1.25)"/>
    <use href="#digit" transform="translate(0.16 1.00)"/>
    <use href="#digit" transform="translate(0.12 0.75)"/>
    <use href="#digit" transform="translate(0.08 0.50)"/>
    <use href="#digit" transform="translate(0.04 0.25)"/>
