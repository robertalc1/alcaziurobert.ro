    <!-- FIX CRITIC: Previne overflow la load -->
    <style>
      /* Aplicat INSTANT la load, înainte de orice altceva */
      /* `clip` after `hidden` so position:sticky descendants still work in modern browsers */
      html {
        overflow-x: hidden !important;
        overflow-x: clip !important;
        max-width: 100vw !important;
        width: 100% !important;
        position: relative;
      }

      body {
        overflow-x: hidden !important;
        overflow-x: clip !important;
        max-width: 100vw !important;
        width: 100% !important;
        position: relative;
        margin: 0;
        padding: 0;
      }

      #root {
        overflow-x: hidden !important;
        overflow-x: clip !important;
        max-width: 100vw !important;
        width: 100% !important;
        position: relative;
      }
      
      /* Previne overflow de la orice element */
      * {
        box-sizing: border-box;
      }
      
      /* Previne drag pe imagini și elemente */
      img, svg, video, canvas, figure {
        max-width: 100%;
        height: auto;
        -webkit-user-drag: none;
        user-drag: none;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
      }
      
      /* Previne overscroll bounce pe mobil */
      @media (max-width: 768px) {
        html, body {
          overscroll-behavior-x: none;
          overscroll-behavior-y: contain;
        }

        * {
          max-width: 100vw;
        }
      }

      /* ====================================================================
         BOOT LOADER — premium first-paint moment with the AR monogram.
         Shown once per session via inline JS below.
         ==================================================================== */
      #app-loader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        /* Same as --page in index.css. Hardcoded because this block is the
           critical CSS that paints before any stylesheet loads — it cannot
           read a custom property that does not exist yet. If --page changes,
           change it here too. */
        background: #F7F8FB;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 18px;
        opacity: 1;
        transform: scale(1);
        transition: opacity 380ms cubic-bezier(0.23, 1, 0.32, 1),
                    transform 380ms cubic-bezier(0.23, 1, 0.32, 1);
        will-change: opacity, transform;
      }
      #app-loader.loader-gone {
        opacity: 0;
        transform: scale(0.985);
        pointer-events: none;
      }
      #app-loader .al-mark {
        width: auto;
        height: clamp(56px, 8vw, 82px);
        display: block;
        opacity: 0;
        transform: scale(0.96);
        animation: al-mark-in 360ms cubic-bezier(0.23, 1, 0.32, 1) forwards,
                   al-breathing 3s 360ms ease-in-out infinite;
      }
      #app-loader .al-label {
        font-family: 'Figtree', system-ui, -apple-system, sans-serif;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #6D727E;
        opacity: 0;
        animation: al-label-in 420ms 220ms cubic-bezier(0.23, 1, 0.32, 1) forwards;
      }
      @keyframes al-mark-in {
        to { opacity: 1; transform: scale(1); }
      }
      @keyframes al-label-in {
        to { opacity: 1; }
      }
      @keyframes al-breathing {
        0%, 100% { transform: scale(1); }
        50%      { transform: scale(1.035); }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-loader .al-mark {
          animation: none;
          opacity: 1;
          transform: none;
        }
        #app-loader .al-label {
          animation: none;
          opacity: 1;
        }
      }
    </style>

    <!-- Meta Pixel (ID 1555333129701586) is NOT inlined here on purpose: under
         GDPR it may only load after the visitor accepts Marketing cookies, so
         Meta's base code lives in src/lib/marketingPixels.ts and is injected
         by the consent flow (src/hooks/use-cookie-consent.tsx). -->
  </head>

  <body>
    <!-- Boot loader (rendered before React mounts). The bootstrap script below
         either hides it instantly (already shown this session) or waits for the
         "app-ready" event dispatched from Hero.tsx after its own first paint. -->
    <div id="app-loader" aria-hidden="true">
      <img class="al-mark" src="/logo-mark.svg" alt="" width="104" height="104" decoding="async" />
      <span class="al-label">Alcaziu Robert</span>
    </div>
    <script>
      (function () {
        var el = document.getElementById("app-loader");
        if (!el) return;
        try {
          if (sessionStorage.getItem("loaderShown")) {
            el.parentNode && el.parentNode.removeChild(el);
            return;
          }
        } catch (e) { /* ignore storage errors */ }
        function hide() {
          if (!el || !el.parentNode) return;
          el.classList.add("loader-gone");
          setTimeout(function () {
            el && el.parentNode && el.parentNode.removeChild(el);
          }, 420);
          try { sessionStorage.setItem("loaderShown", "1"); } catch (e) {}
        }
        window.addEventListener("app-ready", hide, { once: true });
        // Safety net — if the app-ready signal never fires (slow JS, error),
        // hide after 4s so the user is never stuck on a white screen.
        setTimeout(hide, 4000);
      })();
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
