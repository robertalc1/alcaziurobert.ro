<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <title>Alcaziu Robert Portofolio</title>
    <meta name="description" content="Professional web development portfolio" />
    <meta name="author" content="Alcaziu Robert" />
    <meta property="og:image" content="/og-image-update.png" />
    
    <!-- FIX CRITIC: Previne overflow la load -->
    <style>
      /* Aplicat INSTANT la load, înainte de orice altceva */
      html {
        overflow-x: hidden !important;
        max-width: 100vw !important;
        width: 100% !important;
        position: relative;
      }
      
      body {
        overflow-x: hidden !important;
        max-width: 100vw !important;
        width: 100% !important;
        position: relative;
        margin: 0;
        padding: 0;
      }
      
      #root {
        overflow-x: hidden !important;
        max-width: 100vw !important;
        width: 100% !important;
        position: relative;
      }
      
      /* Previne overflow de la orice element */
      * {
        box-sizing: border-box;
      }
      
      /* Previne drag pe imagini și elemente */
      img, svg, video, canvas, figure {
        max-width: 100%;
        height: auto;
        -webkit-user-drag: none;
        user-drag: none;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
      }
      
      /* Previne overscroll bounce pe mobil */
      @media (max-width: 768px) {
        html, body {
          overscroll-behavior-x: none;
          overscroll-behavior-y: contain;
        }
        
        * {
          max-width: 100vw;
        }
      }
    </style>
  </head>
  
  <body>
    <div id="root"></div>
    <!-- IMPORTANT: DO NOT REMOVE THIS SCRIPT TAG OR THIS VERY COMMENT! -->
    <script src="https://cdn.gpteng.co/gptengineer.js" type="module"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
